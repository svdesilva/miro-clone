name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (optional)
      description: Browser, OS, Node version if relevant.
