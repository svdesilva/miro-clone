name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Share an idea or improvement.
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What problem does this solve, or what should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: How you imagine it could work.
